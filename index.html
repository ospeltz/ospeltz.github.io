<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="geologger">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c2410c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="resources/icon-180.png">
  <script src="resources/supabase.js"></script>
  <title>geologger</title>
  <style>
    :root {
      --bg: #edf1f3;
      --card: #fff;
      --text: #1b2a33;
      --muted: #566873;
      --line: #d3dbe0;
      --accent: #c2410c;
      --on-accent: #fff;
      --good: #1a7f4b;
      --warn: #b7791f;
      --bad: #b42318;
      --danger: #b42318;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #12181c;
        --card: #1b242a;
        --text: #e6ecef;
        --muted: #93a3ad;
        --line: #2e3b43;
        --accent: #ff8a4c;
        --on-accent: #2a1405;
        --good: #4ade80;
        --warn: #fbbf24;
        --bad: #f97066;
        --danger: #f97066;
        color-scheme: dark
      }
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 18px 6px
    }

    h1 {
      font-size: 1.3rem;
      margin: 0
    }

    #count {
      color: var(--muted);
      font-size: .9rem
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 8px 18px calc(96px + env(safe-area-inset-bottom, 0px))
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .gps {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-left: 10px solid var(--line);
      border-radius: 10px;
      padding: 6px 7px;
      margin-bottom: 9px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px 14px;
      align-items: baseline;
      color: var(--muted);
      font-size: .9rem
    }

    .gps strong {
      font-size: 1.7rem;
      color: var(--text)
    }

    .gps.good {
      border-left-color: var(--good)
    }

    .gps.ok {
      border-left-color: var(--warn)
    }

    .gps.poor {
      border-left-color: var(--bad)
    }

    .coords {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .9rem
    }

    .field {
      display: block;
      margin-bottom: 14px
    }

    .field>span {
      display: block;
      font-weight: 600;
      font-size: .92rem;
      margin-bottom: 4px
    }

    input[type=text],
    input[type=number],
    input[type=password],
    main select, /* only select selects that are in the body, ie not the header */
    textarea {
      width: 100%;
      font: inherit;
      padding: 12px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text)
    }
    header select {
      /* width: 100%; */
      font: inherit;
      /* padding: 12px; */
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text)
    }

    .field.check {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .field.check>span {
      margin: 0;
      order: 2
    }

    .field.check input {
      width: 26px;
      height: 26px;
      accent-color: var(--accent)
    }

    button {
      touch-action: manipulation
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .counter output {
      min-width: 3ch;
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums
    }

    .cplus {
      flex: 1;
      height: 76px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--on-accent);
      font: 700 2.6rem system-ui, sans-serif;
      cursor: pointer
    }

    .cplus:active {
      filter: brightness(.92)
    }

    .cminus {
      width: 52px;
      height: 52px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font: 700 1.6rem system-ui, sans-serif;
      cursor: pointer
    }

    .btn {
      display: block;
      width: 100%;
      margin: 0 0 12px;
      padding: 16px;
      font: 700 1.1rem system-ui, sans-serif;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer
    }

    .btn:disabled {
      opacity: .6
    }

    #logbtn {
      padding: 16px;
      font-size: 1.35rem;
      margin-top: 6px
    }

    .secondary {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent)
    }

    .danger-btn {
      background: transparent;
      color: var(--danger);
      border: 2px solid var(--danger)
    }

    .link {
      background: none;
      border: 0;
      padding: 8px 0;
      margin-right: 16px;
      font: inherit;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer
    }

    .link:disabled {
      opacity: .4;
      text-decoration: none
    }

    .link.danger {
      color: var(--danger)
    }

    .rec,
    .frow {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px
    }

    .frow {
      display: grid;
      gap: 8px
    }

    .rhead {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .rhead time {
      font-weight: 600
    }

    .rhead .link {
      margin: 0
    }

    .kv span {
      font-weight: 600;
      margin-right: 6px
    }

    .kv span::after {
      content: ":"
    }

    .hint {
      color: var(--muted)
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 28px 0
    }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    nav button {
      flex: 1;
      padding: 15px 0 14px;
      border: 0;
      background: none;
      font: inherit;
      font-size: .95rem;
      color: var(--muted);
      cursor: pointer
    }

    nav button[aria-current=true] {
      color: var(--accent);
      font-weight: 700;
      box-shadow: inset 0 3px 0 var(--accent)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }

    #toast.on {
      opacity: 1
    }

    @media (prefers-reduced-motion:reduce) {
      #toast {
        transition: none
      }
    }
    /* this conditionally styles when on a phone (@media) and in landscape (the max-height prevents this behavior for tablets) */
    @media (orientation: landscape) and (max-height: 500px) {
      main {
        max-width: none;
        padding-left: calc(18px + env(safe-area-inset-left,0px));
        padding-right: calc(18px + env(safe-area-inset-right,0px))
      }
      
      /* create two columns */
      #view.log {
        column-count:2;
        column-gap:18px
      }
      /* allows the gps bar and the log button to stretch across columns */
      /* #view.log #gps,#view.log #logbtn {
        column-span:all
      } */
      /* avoids long fields eg radio buttons from splitting across columns */
      #view.log .field{
        break-inside:avoid
      }
      /* removes padding on left and right */
      nav {
        /* padding-left:env(safe-area-inset-left,0px);
        padding-right:env(safe-area-inset-right,0px) */
        padding-left:0px;
        padding-right: 0px;
      }
      /* moves the nav bar to the left, reclaiming vertical space */
      nav{
        top:0;
        bottom:0;
        right:auto;
        width:auto;
        flex-direction:column;
        border-top:0;
        border-right:1px solid var(--line)
      }
      nav button { 
        padding:14px 12px;
        font-size:.85rem
      }
      /* hides the header in landscape */
      header { display: none }
      /* keeps the main content out of the nav bar on left */
      main{ 
        padding-bottom: 0px;
        margin-left: calc(9px + env(safe-area-inset-left,0px));
      }
    }

    .radio-button label { 
      display: flex; 
      align-items: center; 
      gap: 3px; 
      padding: 2px 0 
    }
    .radio-button input { 
      width: 24px; 
      height: 24px; 
      accent-color: var(--accent) 
    }
    /* edit record popup */
    dialog {
      border: none;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    /* Style the dimmed background overlay */
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
    }
  </style>
</head>

<body>
  <header>
    <h1>geologger</h1>
    <span id="form-picker-box"><select id="form-picker" aria-label="Active form"></select></span>
    <!-- hiding the count for now -->
    <span id="count" hidden="true"></span>
  </header>
  <main id="view"></main>
  <nav>
    <button data-v="log">Log</button>
    <button data-v="records">Points</button>
    <button data-v="form">Fields</button>
    <button data-v="export">Export</button>
  </nav>
  <div id="toast" role="status"></div>
  <script>
    "use strict";
    // sets up shorthand functions for querying html doc
    const $ = (s) => document.querySelector(s);

    // shorthand function for creating html attributes
    // tag = html tag type, attributes as dict to add to tag, any additional args are children of the element
    const el = (tag, attrs = {}, ...kids) => {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") e.className = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else if (k === "value" || k === "disabled") e[k] = v;
        else e.setAttribute(k, v)
      }
      e.append(...kids.flat().filter(c => c != null && c !== false)); return e
    };

    // helper function to reload the screen when switching tabs 
    // .filter(Boolean) is shorthand for removing any 'falsy' values from array
    const mount = (...n) => $("#view").replaceChildren(...n.flat().filter(Boolean));

    // function to create a unique id for elements or for database stuff
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // function to create popup 'toast' messages
    let tt; 
    const toast = (msg) => { 
      const t = $("#toast"); 
      t.textContent = msg; 
      t.classList.add("on"); 
      clearTimeout(tt); 
      tt = setTimeout(() => t.classList.remove("on"), 2600) 
    };

    /* ---------- storage (IndexedDB) ---------- */
    let localDb;
    // open database function returns a promise that accepts two arguments
    // the ok() function is called if opens successfully, else the no function is handed the error
    const openLocalDb = () => new Promise((ok, no) => {
      const r = indexedDB.open("pointlog", 1);
      // this runs if the database does not exist yet, or if the version number on the browser (second param in indexedDB.open)
      r.onupgradeneeded = () => { 
        r.result.createObjectStore("records", { keyPath: "id", autoIncrement: true }); 
        r.result.createObjectStore("meta") 
      };
      // onsuccess globally sets the db
      r.onsuccess = () => { localDb = r.result; ok() }; 
      r.onerror = () => no(r.error)
    });
    // shorthand function to transact with localdb, defaults to readonly, s, a string, is the entity
    // desired to interact w eg 'forms', 'records', 'meta', replace m w 'readwrite' to add to db
    const tx = (s, m = "readonly") => localDb.transaction(s, m).objectStore(s);
    // shorthand function to create a basic promise
    const p = (r) => new Promise((ok, no) => { 
      r.onsuccess = () => ok(r.result); 
      r.onerror = () => no(r.error) 
    });
    /* --------- storage (supabase) ------------ */
    let remoteDb, remoteDbConnected = false;
    
    async function signinToSupabase(dburl, email, publickey, password) {
      // signin to remote db
      remoteDb = window.supabase.createClient(dburl, publickey);
      const { error } = await remoteDb.auth.signInWithPassword({ email: email, password: password });
      if (error) alert(error.message)
      else {
        toast("connected to supabase");
        remoteDbConnected = true;
        await p(tx("meta", "readwrite").put({dburl, publickey, email}, "supabase"))
      }
    }
    async function connectRemoteDb() {
      // bring up a dialog to signin to a supabase db
      let d = el("dialog", {id: "dbsignin"}, 
        el("label", {for:"dburl"}, "Supabase URL ending in .supabase.co"), 
        el("input", {type:"text", name: "dburl"}),
        el("label", {for:"publickey"}, "Supabase publishable key starting with 'sb_publishable_...'"), 
        el("input", {type:"text", name: "publickey"}),
        el("label", {for:"username"}, "Supabase db user email"), 
        el("input", {type:"text", name: "username", autocomplete:"email"}),
        el("label", {for:"pw"}, "Supabase db user password"), 
        el("input", {type:"password", name: "pw", autocomplete:"current-password"}),
        el("button", {class:"btn", onclick: () => {
          signinToSupabase(
            $("input[name=dburl]").value, 
            $("input[name=username]").value, 
            $("input[name=publickey]").value, 
            $("input[name=pw]").value
          );
          $("#dbsignin").remove();
        }}, "sign in")
      )
      $("#view").appendChild(d)
      d.showModal() // open dialog
    }

    // saves the current forms and their fields to the database
    const saveFields = () => p(tx("meta", "readwrite").put(forms, "forms"));

    // returns the active form from the list of forms
    const cur = () => forms.list.find(f => f.id === forms.active) || forms.list[0];

    // updates the display of how many records are stored
    const updateCount = async () => { 
      const n = await p(tx("records").count()); 
      $("#count").textContent = n + (n === 1 ? " point" : " points") 
    };

    /* ---------- state ---------- */
    const TYPES = { 
      counter: "Counter", 
      choice: "Dropdown list", 
      checkbox: "Checkbox",
      radio: "Radio Buttons",
      number: "Number", 
      text: "Short text", 
      note: "Long note", 
    };
    const DEBUG = location.hostname === "localhost";
    let forms = null, fields = [], inputs = {}, kept ={}, fix = null, watchId = null, gpsMsg = "Searching for GPS…";

    /* ---------- GPS ---------- */
    function startGps() {
      // tells the browser to start tracking location
      if (!navigator.geolocation) { gpsMsg = "This browser can’t read your location."; return }
      if (watchId != null) return;
      watchId = navigator.geolocation.watchPosition(
        pos => { // success callback function of watchPosistion
          fix = pos; 
          gpsMsg = ""; 
          paintGps() 
        },
        e => { // error callback
          let errTxt = "Location is blocked. Allow it in Settings › Privacy & Security › Location Services."
          gpsMsg = e.code === 1 ? errTxt : "Searching for GPS… (" + e.code + ": " + e.message + ")";;
          paintGps() 
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
      )
    }
    function stopGps() { 
      if (watchId != null) { 
        // clears the location tracking to save battery
        navigator.geolocation.clearWatch(watchId); 
        watchId = null 
      }
    }
    function paintGps() {
      // is called by the browser on an interval to update the gps display
      const g = $("#gps"); if (!g) return;
      if (!fix) { 
        g.className = "gps"; 
        g.textContent = gpsMsg; 
        return 
      }
      const c = fix.coords, acc = Math.round(c.accuracy), age = Math.round((Date.now() - fix.timestamp) / 1000);
      g.className = "gps " + (acc <= 10 ? "good" : acc <= 30 ? "ok" : "poor");
      g.replaceChildren(
        el("strong", {}, "±" + acc + " m"), 
        el("span", { class: "coords" }, c.latitude.toFixed(4) + ", " + c.longitude.toFixed(4)), 
        el("span", {}, age < 2 ? "just now" : age > 60 ? Math.round(age/60*100)/100 + " m ago" : age + " s ago")
      )
    }
    // this tells the browser to call paintGps every 1 sec, returns an id that can be used to clearInterval()
    setInterval(paintGps, 1000);
    // restarts location tracking when the app reopens as  precaution
    document.addEventListener("visibilitychange", () => { if (!document.hidden && $("#gps")) { stopGps(); startGps() } });

    /* ---------- Log view ---------- */
    function fieldInput(f) {
      // creates a input area for the custom field on the Log view
      let i;
      // long note
      if (f.type === "note") i = el("textarea", { rows: "3" });
      else if (f.type === "number") i = el("input", { type: "number", inputmode: "decimal", step: "any" });
      else if (f.type === "checkbox") i = el("input", { type: "checkbox" });
      else if (f.type === "counter") {
        i = el("div", { class: "counter" }); i.count = 0;
        const out = el("output", { "aria-live": "polite" }, "0");
        // func to set the value of the counter display, prevent negative numbers
        const set = n => { i.count = Math.max(0, n); out.textContent = i.count };
        i.append(
          // + and - buttons for counter
          el("button", { 
              type: "button", class: "cminus", "aria-label": "Subtract one", 
              onclick: () => set(i.count - 1) 
            }, 
            "−"
          ),
          out,
          el("button", { 
              type: "button", class: "cplus", "aria-label": "Add one", 
              onclick: () => set(i.count + 1) 
            }, 
            "+"
          )
        )
      }
      // dropdown choice
      else if (f.type === "choice") i = el(
        "select", {}, 
        // null option
        el("option", { value: "" }, "—"), 
        // unpack opitions as option elements
        ...(f.options || []).map(o => el("option", { value: o }, o))
      )
      else if (f.type === "radio") {
        i = el("div", {"class": "radio-button"},
          // flatMap allows you to output multiple items per item in input array
          // then it flattens them into a 1d array
          ...(f.options || []).map((o, n) => 
            // do i need to assign checked?
            el("label", {},
              el("input", {
                type: "radio", 
                name: "radio-"+f.id, 
                value: o, 
                // this fancy syntax will add the attribute "checked" only if n = 1
                ...(n===0 && {"checked":""})
              }),
              o
            )
          )
        );

      }
      // short text
      else i = el("input", { type: "text" });
      inputs[f.id] = i;
      // restore kept values from previous Log event
      if (f.id in kept) {
        const v = kept[f.id];
        if (f.type === "checkbox") i.checked=v;
        else if (f.type === "counter") {
          i.count=v;
          i.querySelector("output").textContent=v
        }
        else if (f.type === "radio") {
          // click on same one
          i.querySelectorAll("input").forEach(x => x.checked = (x.value === v));
        }
        else i.value=v;
      }
      return el(
        f.type === "counter" || f.type === "radio" ? "div" : "label", 
        { class: f.type === "checkbox" ? "field check" : "field" }, 
        el("span", {}, f.label), 
        i
      )
    }
    function formPicker(after) {
      // dropdown to select which form we are viewing or editing
      // moved to header
      // after is function that gets called when the selected form on this view is changed
      let sel = $("#form-picker")
      sel.remove() // delete node to prevent eventListeners from stacking TODO this is a dumb work around
      $("#form-picker-box").append(el("select", {"id": "form-picker"},
        ...forms.list.map(f => el("option", { value: f.id }, f.name))
      ))
      sel = $("#form-picker")
      sel.value = forms.active;
      sel.addEventListener("change", () => { 
        forms.active = sel.value; 
        fields = cur().fields; 
        saveFields(); 
        after() 
      });
    }
    function renderLog() {
      // renders the 'Log' tab
      inputs = {};
      formPicker(renderLog); // update form-picker in header to run this function (and update the Log tab) when form is changed
      mount(
        // gps info bar
        el("div", { id: "gps", class: "gps" }, gpsMsg), 
        // populates the field inputs
        ...fields.map(fieldInput),
        // button to save data w location
        el("button", { id: "logbtn", class: "btn", onclick: logPoint }, "Log")
      );
      paintGps()
    }
    async function logPoint() {
      // inserts the data on the active form into the db
      // TODO allow log w poor gps for debugging
      const b = $("#logbtn"); b.disabled = true;

      try {
        if (!fix || Date.now() - fix.timestamp > 15000) {
          // location data is stale or unknown
          b.textContent = "Getting GPS fix…";
          // try to get location, this is getCurrentPosition whereas startGps() uses watchPostion
          // here getCurrentPosition will resolve or reject the promise
          fix = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(
            ok, no, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
          ))
        }
        const c = fix.coords, data = {};
        // collect data from fields
        for (const f of fields) {
          const i = inputs[f.id];
          if (f.type === "checkbox") data[f.label] = i.checked
          else if (f.type === "counter") data[f.label] = i.count
          else if (f.type === "number") data[f.label] = (i.value === "" ? "" : Number(i.value))
          else if (f.type === "radio") data[f.label] = i.querySelector('input:checked')?.value
          else data[f.label] = i.value.trim()
        }
        // uses shorthand functions to add to db
        await p(tx("records", "readwrite").add({ 
          uid: crypto.randomUUID(),
          ts: new Date().toISOString(), 
          form: cur().name, 
          lat: c.latitude, 
          lon: c.longitude, 
          acc: c.accuracy, 
          alt: c.altitude, 
          data 
        }));
        // update the working version of the 'kept' fields, values that should persist between logs
        for (const f of fields) {
          if (f.keep) kept[f.id] = data[f.label];
          else delete kept[f.id];
        }
        await p(tx("meta","readwrite").put(kept,"kept")) // add kept fields to db
        toast("Logged, ±" + Math.round(c.accuracy) + " m");
        await updateCount(); 
        renderLog(); // reload the Log screen
      } catch (e) {
        // some error occurred
        toast(e && e.code === 1 ? "Location is blocked for geologger." : "No GPS fix yet. Try again with a clear view of the sky.");
        console.log(e);
        b.disabled = false; 
        b.textContent = "Log"
      }
    }

    /* ---------- Points view ---------- */
    function editRecord(rec) {
      // create a popup to allow the user to edit the rec being viewed
      console.log(rec)
      
      // fields common to every record TODO support timestamp update
      const toLocalInput = iso => { 
        console.log('initial date', iso)
        const d = new Date(iso); 
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); // timezone math from utc 
        console.log('new date', d.toISOString().slice(0, 19))
        return d.toISOString().slice(0, 19);  // slice off the z
      };
      const basefields = {
        // [field type, display name, transformation func]
        lat: ["number", "lattitude", (v) => v],
        lon: ["number", "longitude", (v) => v],
        acc: ["number", "accuracy", (v) => v],
        alt: ["number", "altitude", (v) => v],
        ts:  ["datetime-local", "timestamp (local)", (v) => {toLocalInput(v)}],
      }
      
      const basefielddivs = Object.fromEntries(
        Object.entries(basefields).map(([k, v]) => [ 
          k, 
          el("div", {class: "kv"} , el("span", {}, v[1]), el("input", {"type": v[0], "value": v[2](rec[k])}))
        ],
      ))
      // hacky!
      basefielddivs.ts = el("div", {class: "kv"} , el("span", {}, "timestamp!"), el("input", {"type": "datetime-local", "step":"1", "value": toLocalInput(rec.ts)}))
      console.log(basefielddivs)
      // form specific data fields TODO maintain data type
      const specificdivs = Object.fromEntries(
        Object.entries(rec.data).map(([k, v]) => [
          k,
          el("div", { class: "kv" }, el("span", {}, k), el("input", {"type":"text", "value":String(v)}))
        ]
      ))
  
      let d = el("dialog", {}, 
        el("span", {}, 'Edit Record'),
        ...Object.values(basefielddivs),
        ...Object.values(specificdivs),
        el("button", {class: "btn", onclick: (e) => {
          const basefields = Object.fromEntries(Object.entries(basefielddivs).map(([k, v]) => [k, v.querySelector("input").value]))
          basefields.ts = new Date(basefields.ts).toISOString()
          const datafields = Object.fromEntries(Object.entries(specificdivs).map(([k, v]) => [k, v.querySelector("input").value]))
          console.log({basefields, basefielddivs})
          const newrec = {
            ...rec,
            ...basefields,
            data: datafields
          }
          newrec.synced = false

          alterRecord(rec, newrec, d);
        }}, "save")
      )
      console.log("hello")
      // Close when clicking outside the dialog box
      d.addEventListener('click', (e) => { if (e.target === d) d.remove() })
      
      $("#view").appendChild(d)
      d.showModal() // open dialog
    }

    async function alterRecord(rec, newrec, dialog) {
      // alter the record in the db
      try {
        // force data types
        Object.keys(rec).forEach(k => {
          if (typeof rec[k] === "boolean") newrec[k] = Boolean(newrec[k])
          else if (typeof rec[k] === "number") newrec[k] = Number(newrec[k]) // TODO this doesn't throw an error, just gives nan
        })
        Object.keys(rec.data).forEach(k => {
          if (typeof rec.data[k] === "boolean") newrec.data[k] = Boolean(newrec.data[k])
          else if (typeof rec.data[k] === "number") newrec.data[k] = Number(newrec.data[k])
        })
        console.log('updated', newrec)
        const res = await p(tx("records", "readwrite").put(newrec));
        console.log(res);
      } catch (e) {
        console.log(e);
        alert("epic fail!!!!")
      }
      dialog.remove();
      renderRecords();
    }

    async function renderRecords() {
      // renders the points tab
      formPicker(() => {console.log('WHADDDDDUP')}) // pass no-op function as callback, switching forms does nothing on this tab
      const rs = (await p(tx("records").getAll())).reverse(); // query all forms
      mount(
        rs.length ? null : el("p", { class: "empty" }, "No points yet. Open Log and tap Log point."),
        rs.map(r => el("article", { class: "rec" }, // create display for each record
          el("div", { class: "rhead" }, 
            el("time", {}, new Date(r.ts).toLocaleString()),
            // add delete button
            el("button", { 
              class: "link danger", 
              onclick: async () => { 
                if (confirm("Delete this point?")) { 
                  await p(tx("records", "readwrite").delete(r.id)); 
                  await updateCount(); 
                  renderRecords() 
                } 
              }}, 
              "Delete"
            ),
            el("button", {
              class: "link danger",
              onclick: async () => editRecord(r)
            }, "Edit")
          ),
          r.form ? el("div", { class: "hint" }, r.form) : null, // skips if no form name on record
          el("div", { class: "coords" }, r.lat.toFixed(6) + ", " + r.lon.toFixed(6) + " (±" + Math.round(r.acc) + " m)"),
          // iterate thru attached data, 
          // TODO this filters out values that are empty strings, do i want that?
          Object.entries(r.data).filter(([, v]) => v !== "").map(
            ([k, v]) => el("div", { class: "kv" }, el("span", {}, k), String(v)
          )),
          // el("a", { class: "link", href: "https://maps.apple.com/?ll=" + r.lat + "," + r.lon }, "Open in Maps") // open in maps link
        ))
      )
    }

    /* ---------- Fields view ---------- */
    function move(n, d) { 
      // swaps field at index n up or down d, rerenders and saves to db
      [fields[n], fields[n + d]] = [fields[n + d], fields[n]]; 
      saveFields(); 
      renderForm() 
    }
    function newForm() {
      // handler for creating a new form entity
      const n = (prompt("Name for the new form:") || "").trim(); 
      if (!n) return;
      // new form
      const f = { 
        id: uid(), 
        name: n, 
        fields: [{ id: uid(), label: "Note", type: "text" }] // default field
      };
      forms.list.push(f); 
      forms.active = f.id; 
      fields = f.fields; 
      saveFields(); 
      renderForm()
    }
    function renameForm() {
      // handler to rename active form
      const n = (prompt("Rename form:", cur().name) || "").trim(); 
      if (!n) return;
      cur().name = n; 
      saveFields(); 
      renderForm()
    }
    function deleteForm() {
      // handler to delete current form 
      const c = cur(); 
      if (!confirm("Delete the form “" + c.name + "”? Saved points keep their data.")) return;
      forms.list = forms.list.filter(f => f !== c); // remove from list
      // set active to first in list
      forms.active = forms.list[0].id; 
      fields = forms.list[0].fields; 
      saveFields(); 
      renderForm()
    }
    function renderForm() {
      // renders the Fields tab
      formPicker(renderForm) // update formpicker in header to run this func when form is changed
      mount(
        // form level controls, new rename delete
        el("div", {},
          el("button", { class: "link", onclick: newForm }, "New form"),
          el("button", { class: "link", onclick: renameForm }, "Rename"),
          // add a delete form button only if there are multiple forms
          forms.list.length > 1 ? el("button", { class: "link danger", onclick: deleteForm }, "Delete form") : null
        ),
        el("p", { class: "hint" }, "Choose what you record with each point. Saved points keep the field names they were logged with."),
        // map the existing fields for this form to their saved settings on the Fields tab
        fields.map((f, n) => {
          // field name
          const lab = el("input", { type: "text", value: f.label, "aria-label": "Field name" });
          lab.addEventListener("change", () => { 
            f.label = lab.value.trim() || "Untitled"; 
            saveFields() 
          });
          // drop down selector to select field type
          const sel = el(
            "select",
            { "aria-label": "Field type" }, 
            Object.entries(TYPES).map(([k, t]) => el("option", { value: k }, t))
          );
          sel.value = f.type;
          sel.addEventListener("change", () => { 
            f.type = sel.value; 
            saveFields(); 
            renderForm() 
          });
          let opt = null;
          // for dropdown field types, store the values of the options as an array
          if (f.type === "choice" || f.type === "radio") {
            let placeholderStr = TYPES[f.type] + ', separated by commas'
            // display in input text
            opt = el(
              "input", 
              { type: "text", value: (f.options || []).join(", "), placeholder: placeholderStr, "aria-label": "Choices" }
            );
            // store on object
            opt.addEventListener("change", () => { 
              f.options = opt.value.split(",").map(s => s.trim()).filter(Boolean); 
              saveFields() 
            })
          }
          // checkbox that determines if this fields value is preserved between logs
          const keepBox = el("input", {type: "checkbox"});
          keepBox.checked = !!f.keep;
          keepBox.addEventListener("change", () => {
            f.keep = keepBox.checked;
            if (!f.keep) delete kept[f.id];
            saveFields()
          });
          const keepRow = el("label", {class: "field check"}, el("span", {}, "Keep value after logging"), keepBox);
          return el(
            "div", { class: "frow" }, 
            lab, sel, opt, keepRow, 
            el("div", {},
              // button to move the field up in the list, is disabled if at top
              el("button", { class: "link", disabled: n === 0, onclick: () => move(n, -1) }, "Move up"),
              // button to move the field down in the list, is disable if already at bottom
              el("button", { class: "link", disabled: n === fields.length - 1, onclick: () => move(n, 1) }, "Move down"),
              // delete field button
              el("button", { class: "link danger", 
                onclick: () => { if (confirm("Remove “" + f.label + "”? Saved points keep their data.")) { 
                  fields.splice(n, 1); 
                  saveFields(); 
                  renderForm() 
                }}
              }, "Remove")
            )
          )
        }),
        el( // button to add a new field
          "button", 
          { class: "btn secondary", onclick: () => { 
            fields.push({ id: uid(), label: "New field", type: "text" }); // default new field
            saveFields(); 
            renderForm(); 
          } }, 
          "Add field")
      )
    }

    /* ---------- Export view ---------- */
    async function exportFile(kind) {
      // function to run the export

      // get all records
      const records = await p(tx("records").getAll());
      if (!records.length) { toast("No points to export yet."); return }

      const day = new Date().toISOString().slice(0, 10); 
      let text, name, type;
      if (kind === "csv") {
        // all column names
        const labels = [...new Set(records.flatMap(r => Object.keys(r.data)))];
        // helper function for cleaning data for csv
        const q = (v) => { 
          // replace nulls and undefineds w ""
          v = v == null ? "" : String(v); 
          // tests if any quotes or newlines exist, if they do, quotes the whole value, converting quotes to double quotes
          return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v };
        const rows = [
          ["id", "timestamp", "form", "latitude", "longitude", "accuracy_m", "altitude_m", ...labels],
          ...records.map(r => [r.id, r.ts, r.form, r.lat, r.lon, r.acc, r.alt, ...labels.map(l => r.data[l])])
        ];
        // start with a BOM (byte order mark) to indicate encoding is utf8
        text = "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n"); 
        name = "geologger-" + day + ".csv"; 
        type = "text/csv"
      } else { // assumed is json
        // json doesnt need a BOM
        text = JSON.stringify({
          type: "FeatureCollection", features: records.map(r => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: r.alt != null ? [r.lon, r.lat, r.alt] : [r.lon, r.lat] },
            properties: { id: r.id, timestamp: r.ts, form: r.form, accuracy_m: r.acc, ...r.data }
          }))
        }, null, 2);
        name = "geologger-" + day + ".geojson"; 
        type = "application/json";
      }
      await deliver(text, name, type)
    }
    async function deliver(text, name, type) {
      // interacts wiht the browsers download function to save the data
      const file = new File([text], name, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        // pulls up the iphone share utility which can allow the user to send it somewhere or save it to files
        try { 
          await navigator.share({ files: [file] }); return 
        } catch (e) { 
          if (e.name === "AbortError") return 
        }
      }
      // if the browser is able to use the 'share' funciton it does taht and returns
      // if not this will try to download the data
      const a = el("a", { href: URL.createObjectURL(file), download: name });
      document.body.append(a); 
      a.click(); 
      a.remove()
    }
    function backupForms() {
      // create a backup of all form data including fields
      const day = new Date().toISOString().slice(0, 10);
      deliver(
        JSON.stringify({ geologger: "forms", version: 1, list: forms.list }, null, 2), // hmmm hardcoded version 
        "geologger-forms-" + day + ".json", 
        "application/json"
      )
    }
    function restoreForms() {
      // load forms from json file saved by backupForms
      const inp = el("input", { type: "file", accept: "application/json,.json", style: "display:none" });
      document.body.append(inp);
      inp.addEventListener("change", async () => {
        try {
          // this seems like a possible buggy area if restoring a form with an existing name
          const d = JSON.parse(await inp.files[0].text());
          if (d.geologger !== "forms" || !Array.isArray(d.list) || !d.list.length) throw 0; // invalid input
          for (const f of d.list) {
            let name = String(f.name || "Restored form");
            // make sure imported form name does not match any form names currently in state
            while (forms.list.some(x => x.name === name)) name += " (restored)";
            forms.list.push({ 
              id: uid(), // do i wanna redo the uid? or keep the old one? prob redo incase it matches an existing one
              name, 
              fields: (Array.isArray(f.fields) ? f.fields : []).map(x => ({
                id: uid(), 
                label: String(x.label || "Untitled"), 
                type: TYPES[x.type] ? x.type : "text", 
                options: Array.isArray(x.options) ? x.options.map(String) : [], 
                keep:!!x.keep 
              })) 
            })
          }
          await saveFields(); 
          toast("Restored " + d.list.length + (d.list.length === 1 ? " form" : " forms")); 
          renderExport();
        } catch (e) { 
          toast("That file isn’t a geologger form backup.") 
        }
        inp.remove()
      });
      inp.click()
    }
    async function dbSync() {
      // pushes local logs to the remote database

      const { data: { session } } = await remoteDb.auth.getSession();
      if (!session) return toast("yer sign is fucked")

      const records = await p(tx("records").getAll())
      const toSubmit = records.filter(r => !r.synced)
      console.log(toSubmit.length, "to submit")
      for (let i = 0; i < toSubmit.length; i += 200) {
        const chunk = toSubmit.slice(i, i + 200); // do upload in chunks of 200 records
        const rows = chunk.map(r => ({
          uid: r.uid ??= crypto.randomUUID(),   // gives older records an id
          ts: r.ts, form: r.form, lat: r.lat, lon: r.lon, acc: r.acc, alt: r.alt,
          data: r.data
        }));
        const { error } = await remoteDb.from("records").upsert(rows, { onConflict: "uid" });
        if (error) return toast("Sync failed: " + error.message);
        const store = tx("records", "readwrite");
        chunk.forEach(r => store.put({ ...r, synced: true })); // update records in local db to be true
      }
      toast('synced')
    }
    async function renderExport() {
      // render the export tab
      formPicker(() => {}) // update formPicker to do nothing when changed here
      const n = await p(tx("records").count());
      mount(
        el("p", { class: "hint" }, n + (n === 1 ? " point is" : " points are") + " stored on this phone. Export regularly: clearing Safari data or deleting the app erases them."),
        remoteDbConnected ? 
        el("button", { class: "btn", onclick: dbSync }, "Sync to supabase DB") :
          el("button", { class: "btn", onclick: connectRemoteDb }, "Connect supabase DB"),
        el("button", { class: "btn", onclick: () => exportFile("csv") }, "Export CSV"),
        el("button", { class: "btn", onclick: () => exportFile("geojson") }, "Export GeoJSON"),
        el("button", { class: "btn secondary", onclick: backupForms }, "Back up forms"),
        el("button", { class: "btn secondary", onclick: restoreForms }, "Restore forms from backup"),
        el("p", { class: "hint" }, "A form backup holds your field setup only, not your points."),
        el("button", { 
          class: "btn danger-btn", 
          onclick: async () => { if (n && confirm("Delete all " + n + " points? This can’t be undone.")) { 
            await p(tx("records", "readwrite").clear()); 
            await updateCount(); 
            renderExport() 
          } } }, "Delete all points"
        )
      )
    }

    /* ---------- navigation + startup ---------- */
    function show(v) {
      // navigates between the different tabs
      document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v));
      // assign the view a class according to the current tab so we can style them differently
      $("#view").className = v;
      if (v === "log") { 
        // view log tab, start up the gps tracking and render page
        startGps(); 
        renderLog() 
      }
      else { 
        // if not on log, turn off gps to save power
        stopGps(); 
        ({ 
          // this syntax is an alternative to if else branches
          // it sets up a object that maps to what function to call, then indexes with v and calls it
          records: renderRecords, 
          form: renderForm, 
          export: renderExport 
        })[v]() 
      }
      // browser function
      scrollTo(0, 0)
    }

    // the 'main' of the webapp, starts when opens
    (async () => {
      // connect to local indexedDb
      await openLocalDb();

      // connect to remote supabase
      remoteDbConnected = await p(tx("meta").get("supabase")) // if not setup will return undefined
      
      if (remoteDbConnected) {
        // TODO add way to sign in again
        remoteDb = window.supabase.createClient(remoteDbConnected.dburl, remoteDbConnected.publickey);
        const { data: { session } } = await remoteDb.auth.getSession();
        if (!session) alert('sign in has expired')
      }

      // setup state variables
      forms = await p(tx("meta").get("forms"));
      if (!forms) {
        const old = await p(tx("meta").get("fields"));
        const first = { 
          id: uid(), 
          name: "My form", 
          fields: old || [{ id: uid(), label: "Note", type: "text" }] 
        };
        forms = { active: first.id, list: [first] }; 
        await saveFields()
      }
      fields = cur().fields;
      kept = await p(tx("meta").get("kept")) || {};

      // add functionality to nav buttons
      // any html attribute with data- is ignored by the browser and can be accessed in js by .dataset
      document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.v)));
      await updateCount(); 
      // default to log view
      show("log");
      // if the browser is not saving stuff, ask it to
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      // set up the serviceworker (which saves this apps files to the browser and allows it to work offline)
      if (
        "serviceWorker" in navigator && 
        !location.hostname.endsWith("trycloudflare.com") && // these lines will prevent the service worker form doing anything while debugging
        location.hostname !== "localhost"
      ) 
        navigator.serviceWorker.register("sw.js").catch(() => { });
    })().catch(e => { $("#view").textContent = "Some big ol error: " + e.message }); // catchall error
  </script>
