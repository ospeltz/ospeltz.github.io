<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="geologger">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c2410c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="resources/icon-180.png">
  <title>geologger</title>
  <style>
    :root {
      --bg: #edf1f3;
      --card: #fff;
      --text: #1b2a33;
      --muted: #566873;
      --line: #d3dbe0;
      --accent: #c2410c;
      --on-accent: #fff;
      --good: #1a7f4b;
      --warn: #b7791f;
      --bad: #b42318;
      --danger: #b42318;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #12181c;
        --card: #1b242a;
        --text: #e6ecef;
        --muted: #93a3ad;
        --line: #2e3b43;
        --accent: #ff8a4c;
        --on-accent: #2a1405;
        --good: #4ade80;
        --warn: #fbbf24;
        --bad: #f97066;
        --danger: #f97066;
        color-scheme: dark
      }
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 18px 6px
    }

    h1 {
      font-size: 1.3rem;
      margin: 0
    }

    #count {
      color: var(--muted);
      font-size: .9rem
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 8px 18px calc(96px + env(safe-area-inset-bottom, 0px))
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .gps {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-left: 10px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px 14px;
      align-items: baseline;
      color: var(--muted)
    }

    .gps strong {
      font-size: 1.7rem;
      color: var(--text)
    }

    .gps.good {
      border-left-color: var(--good)
    }

    .gps.ok {
      border-left-color: var(--warn)
    }

    .gps.poor {
      border-left-color: var(--bad)
    }

    .coords {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .9rem
    }

    .field {
      display: block;
      margin-bottom: 14px
    }

    .field>span {
      display: block;
      font-weight: 600;
      font-size: .92rem;
      margin-bottom: 4px
    }

    input[type=text],
    input[type=number],
    select,
    textarea {
      width: 100%;
      font: inherit;
      padding: 12px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text)
    }

    .field.check {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .field.check>span {
      margin: 0;
      order: 2
    }

    .field.check input {
      width: 26px;
      height: 26px;
      accent-color: var(--accent)
    }

    button {
      touch-action: manipulation
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .counter output {
      min-width: 3ch;
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums
    }

    .cplus {
      flex: 1;
      height: 76px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--on-accent);
      font: 700 2.6rem system-ui, sans-serif;
      cursor: pointer
    }

    .cplus:active {
      filter: brightness(.92)
    }

    .cminus {
      width: 52px;
      height: 52px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font: 700 1.6rem system-ui, sans-serif;
      cursor: pointer
    }

    .btn {
      display: block;
      width: 100%;
      margin: 0 0 12px;
      padding: 16px;
      font: 700 1.1rem system-ui, sans-serif;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer
    }

    .btn:disabled {
      opacity: .6
    }

    #logbtn {
      padding: 24px;
      font-size: 1.35rem;
      margin-top: 6px
    }

    .secondary {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent)
    }

    .danger-btn {
      background: transparent;
      color: var(--danger);
      border: 2px solid var(--danger)
    }

    .link {
      background: none;
      border: 0;
      padding: 8px 0;
      margin-right: 16px;
      font: inherit;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer
    }

    .link:disabled {
      opacity: .4;
      text-decoration: none
    }

    .link.danger {
      color: var(--danger)
    }

    .rec,
    .frow {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px
    }

    .frow {
      display: grid;
      gap: 8px
    }

    .rhead {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .rhead time {
      font-weight: 600
    }

    .rhead .link {
      margin: 0
    }

    .kv span {
      font-weight: 600;
      margin-right: 6px
    }

    .kv span::after {
      content: ":"
    }

    .hint {
      color: var(--muted)
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 28px 0
    }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    nav button {
      flex: 1;
      padding: 15px 0 14px;
      border: 0;
      background: none;
      font: inherit;
      font-size: .95rem;
      color: var(--muted);
      cursor: pointer
    }

    nav button[aria-current=true] {
      color: var(--accent);
      font-weight: 700;
      box-shadow: inset 0 3px 0 var(--accent)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }

    #toast.on {
      opacity: 1
    }

    @media (prefers-reduced-motion:reduce) {
      #toast {
        transition: none
      }
    }

    .radio-button label { display:flex; align-items:center; gap:3px; padding:2px 0 }
    .radio-button input { width:24px; height:24px; accent-color:var(--accent) }
  </style>
</head>

<body>
  <header>
    <h1>geologger</h1><span id="count"></span>
  </header>
  <main id="view"></main>
  <nav>
    <button data-v="log">Log</button>
    <button data-v="records">Points</button>
    <button data-v="form">Fields</button>
    <button data-v="export">Export</button>
  </nav>
  <div id="toast" role="status"></div>
  <script>
    "use strict";
    // sets up shorthand functions for querying html doc
    const $ = s => document.querySelector(s);
    // shorthand function for creating html attributes
    // tag = html tag type, attributes as dict to add to tag, any additional args are children of the element
    const el = (tag, attrs = {}, ...kids) => {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") e.className = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else if (k === "value" || k === "disabled") e[k] = v;
        else e.setAttribute(k, v)
      }
      e.append(...kids.flat().filter(c => c != null && c !== false)); return e
    };

    // function to reload the screen when switching tabs 
    // .filter(Boolean) is shorthand for removing any 'falsy' values from array
    const mount = (...n) => $("#view").replaceChildren(...n.flat().filter(Boolean));
    // function to create a unique id for elements or for database stuff
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    let tt; 
    // function to create popup 'toast' messages
    const toast = m => { 
      const t = $("#toast"); 
      t.textContent = m; 
      t.classList.add("on"); 
      clearTimeout(tt); 
      tt = setTimeout(() => t.classList.remove("on"), 2600) 
    };

    /* ---------- storage (IndexedDB) ---------- */
    let db;
    const openDb = () => new Promise((ok, no) => {
      const r = indexedDB.open("pointlog", 1);
      r.onupgradeneeded = () => { 
        r.result.createObjectStore("records", { keyPath: "id", autoIncrement: true }); 
        r.result.createObjectStore("meta") 
      };
      r.onsuccess = () => { db = r.result; ok() }; 
      r.onerror = () => no(r.error)
    });
    const tx = (s, m = "readonly") => db.transaction(s, m).objectStore(s);
    const p = r => new Promise((ok, no) => { 
      r.onsuccess = () => ok(r.result); 
      r.onerror = () => no(r.error) 
    });
    const saveFields = () => p(tx("meta", "readwrite").put(forms, "forms"));
    const cur = () => forms.list.find(f => f.id === forms.active) || forms.list[0];
    const updateCount = async () => { 
      const n = await p(tx("records").count()); 
      $("#count").textContent = n + (n === 1 ? " point" : " points") 
    };

    /* ---------- state ---------- */
    const TYPES = { 
      counter: "Counter", 
      choice: "Dropdown list", 
      checkbox: "Checkbox",
      radio: "Radio Buttons",
      number: "Number", 
      text: "Short text", 
      note: "Long note", 
    };
    const DEBUG = true;
    let forms = null, fields = [], inputs = {}, kept ={}, fix = null, watchId = null, gpsMsg = "Searching for GPS…";

    /* ---------- GPS ---------- */
    function startGps() {
      if (!navigator.geolocation) { gpsMsg = "This browser can’t read your location."; return }
      if (watchId != null) return;
      watchId = navigator.geolocation.watchPosition(
        pos => { 
          fix = pos; 
          gpsMsg = ""; 
          paintGps() 
        },
        e => { 
          let errTxt = "Location is blocked. Allow it in Settings › Privacy & Security › Location Services."
          gpsMsg = e.code === 1 ? errTxt : "Searching for GPS… (" + e.code + ": " + e.message + ")";;
          paintGps() 
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
      )
    }
    function stopGps() { 
      if (watchId != null) { 
        navigator.geolocation.clearWatch(watchId); 
        watchId = null 
      }
    }
    function paintGps() {
      const g = $("#gps"); if (!g) return;
      if (!fix) { 
        g.className = "gps"; 
        g.textContent = gpsMsg; 
        return 
      }
      const c = fix.coords, acc = Math.round(c.accuracy), age = Math.round((Date.now() - fix.timestamp) / 1000);
      g.className = "gps " + (acc <= 10 ? "good" : acc <= 30 ? "ok" : "poor");
      g.replaceChildren(
        el("strong", {}, "±" + acc + " m"), 
        el("span", { class: "coords" }, c.latitude.toFixed(6) + ", " + c.longitude.toFixed(6)), 
        el("span", {}, age < 2 ? "just now" : age + " s ago")
      )
    }
    setInterval(paintGps, 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && $("#gps")) { stopGps(); startGps() } });

    /* ---------- Log view ---------- */
    function fieldInput(f) {
      // creates a input area for the custom field on the Log view
      let i;
      // long note
      if (f.type === "note") i = el("textarea", { rows: "3" });
      else if (f.type === "number") i = el("input", { type: "number", inputmode: "decimal", step: "any" });
      else if (f.type === "checkbox") i = el("input", { type: "checkbox" });
      else if (f.type === "counter") {
        i = el("div", { class: "counter" }); i.count = 0;
        const out = el("output", { "aria-live": "polite" }, "0");
        // func to set the value of the counter display, prevent negative numbers
        const set = n => { i.count = Math.max(0, n); out.textContent = i.count };
        i.append(
          // + and - buttons for counter
          el("button", { 
              type: "button", class: "cminus", "aria-label": "Subtract one", 
              onclick: () => set(i.count - 1) 
            }, 
            "−"
          ),
          out,
          el("button", { 
              type: "button", class: "cplus", "aria-label": "Add one", 
              onclick: () => set(i.count + 1) 
            }, 
            "+"
          )
        )
      }
      // dropdown choice
      else if (f.type === "choice") i = el(
        "select", {}, 
        // null option
        el("option", { value: "" }, "—"), 
        // unpack opitions as option elements
        ...(f.options || []).map(o => el("option", { value: o }, o))
      )
      else if (f.type === "radio") {
        i = el("div", {"class": "radio-button"},
          // flatMap allows you to output multiple items per item in input array
          // then it flattens them into a 1d array
          ...(f.options || []).map((o, n) => 
            // do i need to assign checked?
            el("label", {},
              el("input", {
                "type": "radio", 
                "name": "radio-"+f.id, 
                "value": o, 
                // this fancy syntax will add the attribute "checked" only if n = 1
                ...(n===0 && {"checked":""})
              }),
              o
            )
          )
        );

      }
      // short text
      else i = el("input", { type: "text" });
      inputs[f.id] = i;
      // restore kept values from previous Log event
      if (f.id in kept) {
        const v = kept[f.id];
        if (f.type === "checkbox") i.checked=v;
        else if (f.type === "counter") {
          i.count=v;
          i.querySelector("output").textContent=v
        }
        else if (f.type === "radio") {
          // click on same one
          i.querySelectorAll("input").forEach(x => x.checked = (x.value === v));
        }
        else i.value=v;
      }
      return el(
        f.type === "counter" || f.type === "radio" ? "div" : "label", 
        { class: f.type === "checkbox" ? "field check" : "field" }, 
        el("span", {}, f.label), 
        i
      )
    }
    function formPicker(after) {
      // dropdown to select which form we are viewing or editing
      // what does after do? my guess is it calls it as a function first
      const s = el("select", { "aria-label": "Form", "name":"formpicker" }, forms.list.map(f => el("option", { value: f.id }, f.name)));
      s.value = forms.active;
      s.addEventListener("change", () => { forms.active = s.value; fields = cur().fields; saveFields(); after() });
      return el("label", { class: "field" }, el("span", {}, "Form"), s)
    }
    function renderLog() {
      // renders the 'Log' tab
      inputs = {};
      mount(
        // gps info bar
        el("div", { id: "gps", class: "gps" }, gpsMsg), 
        // option to switch between different forms
        forms.list.length > 1 ? formPicker(renderLog) : null, 
        // populates the field inputs
        ...fields.map(fieldInput),
        // button to save data w location
        el("button", { id: "logbtn", class: "btn", onclick: logPoint }, "Log")
      );
      paintGps()
    }
    async function logPoint() {
      // inserts the data on the active form into the db
      // TODO radio button needs some special logic probs
      // TODO allow log w poor gps for debugging
      const b = $("#logbtn"); b.disabled = true;

      try {
        if (!fix || Date.now() - fix.timestamp > 15000) {
          b.textContent = "Getting GPS fix…";
          fix = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }))
        }
        const c = fix.coords, data = {};
        // collect data from fields
        for (const f of fields) {
          const i = inputs[f.id];
          if (f.type === "checkbox") data[f.label] = i.checked
          else if (f.type === "counter") data[f.label] = i.count
          else if (f.type === "number") data[f.label] = (i.value === "" ? "" : Number(i.value))
          else if (f.type === "radio") data[f.label] = i.querySelector('input:checked')?.value
          else data[f.label] = i.value.trim()
          // data[f.label] = f.type === "checkbox" ? i.checked : f.type === "counter" ? i.count : f.type === "number" ? (i.value === "" ? "" : Number(i.value)) : i.value.trim()
        }
        await p(tx("records", "readwrite").add({ ts: new Date().toISOString(), form: cur().name, lat: c.latitude, lon: c.longitude, acc: c.accuracy, alt: c.altitude, data }));
        for (const f of fields) {
          if (f.keep) kept[f.id] = data[f.label];
          else delete kept[f.id];
        }
        await p(tx("meta","readwrite").put(kept,"kept")) // add kept fields to db
        toast("Logged, ±" + Math.round(c.accuracy) + " m");
        await updateCount(); renderLog();
      } catch (e) {
        toast(e && e.code === 1 ? "Location is blocked for geologger." : "No GPS fix yet. Try again with a clear view of the sky.");
        console.log(e);
        b.disabled = false; b.textContent = "Log"
      }
    }

    /* ---------- Points view ---------- */
    async function renderRecords() {
      const rs = (await p(tx("records").getAll())).reverse();
      mount(rs.length ? null : el("p", { class: "empty" }, "No points yet. Open Log and tap Log point."),
        rs.map(r => el("article", { class: "rec" },
          el("div", { class: "rhead" }, el("time", {}, new Date(r.ts).toLocaleString()),
            el("button", { class: "link danger", onclick: async () => { if (confirm("Delete this point?")) { await p(tx("records", "readwrite").delete(r.id)); await updateCount(); renderRecords() } } }, "Delete")),
          r.form ? el("div", { class: "hint" }, r.form) : null,
          el("div", { class: "coords" }, r.lat.toFixed(6) + ", " + r.lon.toFixed(6) + " (±" + Math.round(r.acc) + " m)"),
          Object.entries(r.data).filter(([, v]) => v !== "").map(([k, v]) => el("div", { class: "kv" }, el("span", {}, k), v === true ? "yes" : v === false ? "no" : String(v))),
          el("a", { class: "link", href: "https://maps.apple.com/?ll=" + r.lat + "," + r.lon }, "Open in Maps"))))
    }

    /* ---------- Fields view ---------- */
    function move(n, d) { 
      [fields[n], fields[n + d]] = [fields[n + d], fields[n]]; 
      saveFields(); 
      renderForm() 
    }
    function newForm() {
      const n = (prompt("Name for the new form:") || "").trim(); if (!n) return;
      const f = { id: uid(), name: n, fields: [{ id: uid(), label: "Note", type: "text" }] };
      forms.list.push(f); 
      forms.active = f.id; 
      fields = f.fields; 
      saveFields(); 
      renderForm()
    }
    function renameForm() {
      const n = (prompt("Rename form:", cur().name) || "").trim(); if (!n) return;
      cur().name = n; 
      saveFields(); 
      renderForm()
    }
    function deleteForm() {
      const c = cur(); 
      if (!confirm("Delete the form “" + c.name + "”? Saved points keep their data.")) return;
      forms.list = forms.list.filter(f => f !== c); 
      forms.active = forms.list[0].id; 
      fields = cur().fields; 
      saveFields(); 
      renderForm()
    }
    function renderForm() {
      mount(
        formPicker(renderForm),
        // creates the area to select which form we are altering or create a new one
        el("div", {},
          el("button", { class: "link", onclick: newForm }, "New form"),
          el("button", { class: "link", onclick: renameForm }, "Rename"),
          // add a delete form button only if there are multiple forms
          forms.list.length > 1 ? el("button", { class: "link danger", onclick: deleteForm }, "Delete form") : null
        ),
        el("p", { class: "hint" }, "Choose what you record with each point. Saved points keep the field names they were logged with."),
        // map the existing fields for this form to their saved settings on the Fields tab
        fields.map((f, n) => {
          // field name
          const lab = el("input", { type: "text", value: f.label, "aria-label": "Field name" });
          lab.addEventListener("change", () => { f.label = lab.value.trim() || "Untitled"; saveFields() });
          // drop down selector to select field type
          const sel = el(
            "select",
            { "aria-label": "Field type" }, 
            Object.entries(TYPES).map(([k, t]) => el("option", { value: k }, t))
          );
          sel.value = f.type;
          sel.addEventListener("change", () => { 
            f.type = sel.value; 
            saveFields(); 
            renderForm() 
          });
          let opt = null;
          // for dropdown field types, store the values of the options as an array
          if (f.type === "choice" || f.type === "radio") {
            let placeholderStr = TYPES[f.type] + ', separated by commas'
            // display in input
            opt = el(
              "input", 
              { type: "text", value: (f.options || []).join(", "), placeholder: placeholderStr, "aria-label": "Choices" }
            );
            // store on object
            opt.addEventListener("change", () => { 
              f.options = opt.value.split(",").map(s => s.trim()).filter(Boolean); 
              saveFields() 
            })
          }
          const keepBox = el("input", {type: "checkbox"});
          keepBox.checked = !!f.keep;
          keepBox.addEventListener("change",()=>{
            f.keep=keepBox.checked;
            if (!f.keep) delete kept[f.id];
            saveFields()
          });
          const keepRow = el("label", {class: "field check"}, el("span", {}, "Keep value after logging"), keepBox);
          return el(
            "div", { class: "frow" }, 
            lab, sel, opt, keepRow, 
            el("div", {},
              el("button", { class: "link", disabled: n === 0, onclick: () => move(n, -1) }, "Move up"),
              el("button", { class: "link", disabled: n === fields.length - 1, onclick: () => move(n, 1) }, "Move down"),
              el("button", { class: "link danger", 
                onclick: () => { if (confirm("Remove “" + f.label + "”? Saved points keep their data.")) { 
                  fields.splice(n, 1); 
                  saveFields(); 
                  renderForm() 
                }}
              }, "Remove")
            )
          )
        }),
        el(
          "button", 
          { class: "btn secondary", onclick: () => { 
            fields.push({ id: uid(), label: "New field", type: "text" }); 
            saveFields(); 
            renderForm(); 
          } }, 
          "Add field")
      )
    }

    /* ---------- Export view ---------- */
    async function exportFile(kind) {
      const rs = await p(tx("records").getAll());
      if (!rs.length) { toast("No points to export yet."); return }
      const day = new Date().toISOString().slice(0, 10); let text, name, type;
      if (kind === "csv") {
        const labels = [...new Set(rs.flatMap(r => Object.keys(r.data)))];
        const q = v => { v = v == null ? "" : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v };
        const rows = [["timestamp", "form", "latitude", "longitude", "accuracy_m", "altitude_m", ...labels],
        ...rs.map(r => [r.ts, r.form, r.lat, r.lon, r.acc, r.alt, ...labels.map(l => r.data[l])])];
        text = "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n"); name = "geologger-" + day + ".csv"; type = "text/csv"
      }
      else {
        text = JSON.stringify({
          type: "FeatureCollection", features: rs.map(r => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: r.alt != null ? [r.lon, r.lat, r.alt] : [r.lon, r.lat] },
            properties: { timestamp: r.ts, form: r.form, accuracy_m: r.acc, ...r.data }
          }))
        }, null, 2);
        name = "geologger-" + day + ".geojson"; type = "application/json"
      }
      await deliver(text, name, type)
    }
    async function deliver(text, name, type) {
      const file = new File([text], name, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return } catch (e) { if (e.name === "AbortError") return }
      }
      const a = el("a", { href: URL.createObjectURL(file), download: name });
      document.body.append(a); a.click(); a.remove()
    }
    function backupForms() {
      const day = new Date().toISOString().slice(0, 10);
      deliver(JSON.stringify({ geologger: "forms", version: 1, list: forms.list }, null, 2), "geologger-forms-" + day + ".json", "application/json")
    }
    function restoreForms() {
      const inp = el("input", { type: "file", accept: "application/json,.json", style: "display:none" });
      document.body.append(inp);
      inp.addEventListener("change", async () => {
        try {
          const d = JSON.parse(await inp.files[0].text());
          if (d.geologger !== "forms" || !Array.isArray(d.list) || !d.list.length) throw 0;
          for (const f of d.list) {
            let name = String(f.name || "Restored form");
            while (forms.list.some(x => x.name === name)) name += " (restored)";
            forms.list.push({ id: uid(), name, fields: (Array.isArray(f.fields) ? f.fields : []).map(x => ({
             id: uid(), 
             label: String(x.label || "Untitled"), 
             type: TYPES[x.type] ? x.type : "text", 
             options: Array.isArray(x.options) ? x.options.map(String) : [], 
             keep:!!x.keep 
            })) })
          }
          await saveFields(); toast("Restored " + d.list.length + (d.list.length === 1 ? " form" : " forms")); renderExport();
        } catch (e) { toast("That file isn’t a geologger form backup.") }
        inp.remove()
      });
      inp.click()
    }
    async function renderExport() {
      const n = await p(tx("records").count());
      mount(el("p", { class: "hint" }, n + (n === 1 ? " point is" : " points are") + " stored on this phone. Export regularly: clearing Safari data or deleting the app erases them."),
        el("button", { class: "btn", onclick: () => exportFile("csv") }, "Export CSV"),
        el("button", { class: "btn", onclick: () => exportFile("geojson") }, "Export GeoJSON"),
        el("button", { class: "btn secondary", onclick: backupForms }, "Back up forms"),
        el("button", { class: "btn secondary", onclick: restoreForms }, "Restore forms from backup"),
        el("p", { class: "hint" }, "A form backup holds your field setup only, not your points."),
        el("button", { class: "btn danger-btn", onclick: async () => { if (n && confirm("Delete all " + n + " points? This can’t be undone.")) { await p(tx("records", "readwrite").clear()); await updateCount(); renderExport() } } }, "Delete all points"))
    }

    /* ---------- navigation + startup ---------- */
    function show(v) {
      document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v));
      if (v === "log") { startGps(); renderLog() }
      else { stopGps(); ({ records: renderRecords, form: renderForm, export: renderExport })[v]() }
      scrollTo(0, 0)
    }
    (async () => {
      await openDb();
      forms = await p(tx("meta").get("forms"));
      if (!forms) {
        const old = await p(tx("meta").get("fields"));
        const first = { id: uid(), name: "My form", fields: old || [{ id: uid(), label: "Note", type: "text" }] };
        forms = { active: first.id, list: [first] }; await saveFields()
      }
      fields = cur().fields;
      kept = await p(tx("meta").get("kept"))||{};
      document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.v)));
      await updateCount(); show("log");
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
    })().catch(e => { $("#view").textContent = "Storage is unavailable: " + e.message });
  </script>
</body>

</html>
